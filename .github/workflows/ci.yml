name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run it superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches Vite 8's engine range (^20.19.0 || >=22.12.0).
          node-version: '22.12'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/api/pom.xml

      # Formatting (Spotless), unit tests, and integration tests against a real
      # PostgreSQL that Testcontainers starts on the runner's Docker.
      - name: Verify
        run: ./mvnw -B -ntp verify

  python:
    name: Python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/simulator/requirements-dev.txt
            scripts/measure-pipeline/requirements-dev.txt

      - name: Install tools
        run: |
          pip install -r backend/simulator/requirements-dev.txt
          pip install -r scripts/measure-pipeline/requirements-dev.txt

      # Each project is checked from its own directory so that Ruff and Black
      # read that project's pyproject.toml.
      - name: Simulator
        working-directory: backend/simulator
        run: |
          ruff check .
          black --check .
          pytest

      - name: Facility registry build
        working-directory: scripts/facility-registry
        run: |
          ruff check .
          black --check .
          pytest

      # Imports the simulator's client and the detector's settings from their
      # own directories, as its pyproject.toml says.
      - name: Pipeline measurement
        working-directory: scripts/measure-pipeline
        run: |
          ruff check .
          black --check .
          pytest

      # Run against the whole stack in the Images and full stack job; linted here.
      - name: Smoke test
        working-directory: scripts/smoke-test
        run: |
          ruff check .
          black --check .

  detector:
    name: Detector
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/detector

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/detector/requirements.txt
            backend/detector/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: black --check .

      # Integration tests start PostgreSQL with Testcontainers on the runner's
      # Docker, and build its schema from the API's Flyway migrations. The
      # evaluation tests use the simulator from ../simulator.
      - name: Test
        run: pytest

  stack:
    name: Images and full stack
    runs-on: ubuntu-latest
    # The first build fills the cache; later ones take a few minutes, and the
    # backfill about three more.
    timeout-minutes: 40
    env:
      COMPOSE: docker compose --env-file .env -f infra/docker-compose.yml --profile app

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Each image is built as compose builds it, from the repository root, and
      # loaded under the name compose runs it by. Layers are cached between runs.
      # Nothing is pushed anywhere.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          tags: sentinel-api:local
          load: true
          provenance: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          tags: sentinel-web:local
          load: true
          provenance: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build the detector image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/detector.Dockerfile
          tags: sentinel-detector:local
          load: true
          provenance: false
          cache-from: type=gha,scope=detector
          cache-to: type=gha,scope=detector,mode=max

      - name: Build the simulator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/simulator.Dockerfile
          tags: sentinel-simulator:local
          load: true
          provenance: false
          cache-from: type=gha,scope=simulator
          cache-to: type=gha,scope=simulator,mode=max

      # The example settings, as they are: a stack on a throwaway runner, with
      # every port on loopback.
      - name: Settings
        run: cp infra/.env.example .env

      # Returns once the API is healthy and the backfill has finished, or fails
      # if either does not.
      - name: Start the full stack
        run: $COMPOSE up -d --no-build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The site, the API through the proxy, the alert socket's origin check,
      # district scope, and the detector's first alerts from the simulated
      # history.
      - name: Smoke test
        run: python scripts/smoke-test/smoke_test.py --alert-timeout 600

      - name: Logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 200

      - name: Stop
        if: always()
        run: $COMPOSE down -v
