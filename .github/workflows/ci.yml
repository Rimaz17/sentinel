name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run it superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches Vite 8's engine range (^20.19.0 || >=22.12.0).
          node-version: '22.12'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/api/pom.xml

      # Formatting (Spotless), unit tests, and integration tests against a real
      # PostgreSQL that Testcontainers starts on the runner's Docker.
      - name: Verify
        run: ./mvnw -B -ntp verify

  python:
    name: Python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/simulator/requirements-dev.txt
            scripts/measure-pipeline/requirements-dev.txt

      - name: Install tools
        run: |
          pip install -r backend/simulator/requirements-dev.txt
          pip install -r scripts/measure-pipeline/requirements-dev.txt

      # Each project is checked from its own directory so that Ruff and Black
      # read that project's pyproject.toml.
      - name: Simulator
        working-directory: backend/simulator
        run: |
          ruff check .
          black --check .
          pytest

      - name: Facility registry build
        working-directory: scripts/facility-registry
        run: |
          ruff check .
          black --check .
          pytest

      # Imports the simulator's client and the detector's settings from their
      # own directories, as its pyproject.toml says.
      - name: Pipeline measurement
        working-directory: scripts/measure-pipeline
        run: |
          ruff check .
          black --check .
          pytest

      # Run against the whole stack in the Images and full stack job; linted here.
      - name: Smoke test
        working-directory: scripts/smoke-test
        run: |
          ruff check .
          black --check .

  detector:
    name: Detector
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/detector

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/detector/requirements.txt
            backend/detector/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: black --check .

      # Integration tests start PostgreSQL with Testcontainers on the runner's
      # Docker, and build its schema from the API's Flyway migrations. The
      # evaluation tests use the simulator from ../simulator.
      - name: Test
        run: pytest
