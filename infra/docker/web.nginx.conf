# The web container: serves the built frontend, and passes everything under
# /api to the API, so the browser only ever talks to one origin, as it does
# through Vite's dev server. See docs/adr/0021-full-stack-in-docker-compose.md.

# Docker's own DNS. The API's address is looked up per request rather than once
# at start, so a recreated API container is found at its new address.
resolver 127.0.0.11 valid=10s ipv6=off;

# The alert socket's upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Reports are small; this is the API's own limit for anything else.
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    server_tokens off;

    set $api http://api:8080;

    # X-Forwarded-Proto and X-Forwarded-Port are passed on only as a proxy in
    # front of this one reports them (TLS on a deployed demo); with nothing in
    # front they are empty, and nginx sends no empty header. They are never set
    # from this server's own scheme: behind TLS, it sees plain HTTP.

    # The alert socket (docs/adr/0016). The API accepts the handshake only from
    # a page on its own origin, which it judges from the Host header, so the
    # visitor's Host, port included, is passed on unchanged.
    location /api/ws {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        # Each side sends a heartbeat every ten seconds, so a minute of silence
        # means the connection is gone.
        proxy_read_timeout 60s;
    }

    # The API. X-Forwarded-For carries the visitor's address, which the API
    # trusts only from a proxy on a private network, as this one is, so its
    # sign-in rate limit counts each visitor rather than this container.
    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
    }

    # Vite's hashed bundles change name whenever they change, so a browser may
    # keep them for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # Every other path is a page of the single-page app, answered with
    # index.html, which is never cached, so a new build is seen at once.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        try_files $uri /index.html;
    }
}
