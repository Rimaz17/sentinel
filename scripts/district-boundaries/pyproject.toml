[project]
name = "sentinel-district-boundaries"
version = "0.1.0"
description = "Builds the public map's district outlines from geoBoundaries"
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
