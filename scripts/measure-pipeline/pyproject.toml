[project]
name = "sentinel-measure-pipeline"
version = "0.1.0"
description = "Measures the report pipeline's throughput and submission-to-storage latency"
requires-python = ">=3.12"
# Runtime dependencies are pinned in requirements.txt, development tools in requirements-dev.txt.

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["measure_pipeline", "sentinel_detector", "sentinel_simulator"]

[tool.pytest.ini_options]
# It drives the simulator's client and reads the database as the detector does.
pythonpath = [".", "../../backend/simulator", "../../backend/detector"]
