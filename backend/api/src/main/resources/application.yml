spring:
  application:
    name: sentinel-api
  config:
    # Local runs read the repository's .env, whether started from the repository
    # root or from backend/api. Real environment variables take precedence.
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]
  datasource:
    url: ${SENTINEL_DB_URL}
    username: ${SENTINEL_DB_USERNAME}
    password: ${SENTINEL_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway migrations are the only schema authority.
      ddl-auto: validate
  # Reports travel from ingestion to storage through Kafka. See
  # docs/adr/0014-kafka-between-ingestion-and-storage.md.
  kafka:
    bootstrap-servers: ${SENTINEL_KAFKA_BOOTSTRAP_SERVERS}
    admin:
      # The API creates its topics as it starts. Without Kafka it refuses to
      # start, rather than run on and accept no report.
      fail-fast: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      # A report is accepted only once every in-sync copy of it is written, and
      # a retried send is never written twice.
      acks: all
      properties:
        enable.idempotence: true
        # With Kafka down, a submission fails within about six seconds, well
        # inside a client's timeout, instead of hanging.
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 6000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      # A new consumer group starts from the oldest report still on the topic,
      # so nothing published before the first start is skipped.
      auto-offset-reset: earliest

sentinel:
  auth:
    # Left empty when unset, so startup fails with a message saying what to set.
    jwt-secret: ${SENTINEL_JWT_SECRET:}
    cookie-secure: ${SENTINEL_COOKIE_SECURE:true}
  # The trusted report feed the simulator submits through. Unset switches it off.
  feed:
    key: ${SENTINEL_FEED_KEY:}
  # Requests per minute: sign-in, registration and activation per client address,
  # and report submissions per data provider account.
  rate-limit:
    auth-per-minute: 10
    ingestion-per-minute: 120
  alerts:
    # How far above baseline, in standard deviations, an alert no inspector has
    # judged must peak to be published anyway. See docs/adr/0013-public-alerts.md.
    public-threshold: 5.0
  # The administrator provisioned at setup. Created once, never overwritten.
  admin:
    email: ${SENTINEL_ADMIN_EMAIL:}
    password: ${SENTINEL_ADMIN_PASSWORD:}
