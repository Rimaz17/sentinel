spring:
  application:
    name: sentinel-api
  config:
    # Local runs read the repository's .env, whether started from the repository
    # root or from backend/api. Real environment variables take precedence.
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]
  datasource:
    url: ${SENTINEL_DB_URL}
    username: ${SENTINEL_DB_USERNAME}
    password: ${SENTINEL_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway migrations are the only schema authority.
      ddl-auto: validate

sentinel:
  auth:
    # Left empty when unset, so startup fails with a message saying what to set.
    jwt-secret: ${SENTINEL_JWT_SECRET:}
    cookie-secure: ${SENTINEL_COOKIE_SECURE:true}
  # The administrator provisioned at setup. Created once, never overwritten.
  admin:
    email: ${SENTINEL_ADMIN_EMAIL:}
    password: ${SENTINEL_ADMIN_PASSWORD:}
